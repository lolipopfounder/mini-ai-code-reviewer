services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Default: reach Ollama on the host. For a hosted LLM, override (see below).
      LLM_BASE_URL: ${LLM_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000 
    ports:
      - "5173:80"
    depends_on:
      - backend


